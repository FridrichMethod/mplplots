repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The example SVGs are written by Matplotlib and must stay byte for byte as rendered.
      - id: trailing-whitespace
        exclude: ^examples/.*\.svg$
      - id: end-of-file-fixer
        exclude: ^examples/.*\.svg$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=40000"]

  # Code and documentation are in American English and ASCII (AGENTS.md, Code Style).
  - repo: local
    hooks:
      - id: ascii-only
        name: ASCII characters only
        language: pygrep
        entry: '[^\x00-\x7F]'
        types: [text]
        exclude: ^examples/.*\.svg$

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: American spelling
        # GREYS is named after the Matplotlib colormap Greys that it samples.
        args: [--builtin, en-GB_to_en-US, --ignore-words-list, greys]
        exclude: ^examples/.*\.svg$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.0
    hooks:
      - id: mypy
        additional_dependencies: [matplotlib, numpy, pandas, scipy, seaborn]
        args: [--config-file=pyproject.toml]
