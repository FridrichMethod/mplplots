name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Check style
        run: pre-commit run --all-files

      - name: Run tests
        run: pytest tests/ -v

  oldest-supported:
    # The oldest versions pyproject.toml allows: Python 3.12 and Matplotlib 3.8.0, whose wheels
    # need NumPy 1.x.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]" "matplotlib==3.8.0" "numpy<2"

      - name: Run tests
        run: pytest tests/ -v
